<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Media Awake status panel">
  <defs>
    <style>
      .bg { fill: #0d1423; }
      .frame { fill: none; stroke: #4bbfe9; stroke-width: 6; }
      .text { fill: #e9edf5; font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .muted { fill: #a8b4c7; }
      .line { stroke: #adb7c6; stroke-width: 2; }
      .switch-bg { fill: #b9c0cd; }
      .switch-knob { fill: #e8edf6; }
      .coffee-body { fill: #d7dde7; }
      .coffee-handle { fill: none; stroke: #d7dde7; stroke-width: 10; stroke-linecap: round; }
      .coffee-shadow { fill: rgba(0,0,0,0.15); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720" fill="#111a2c"/>

  <g transform="translate(130,200)">
    <rect class="frame" x="0" y="0" width="1020" height="250" rx="2"/>

    <g transform="translate(56,42)">
      <g transform="translate(20,10)">
        <ellipse class="coffee-shadow" cx="36" cy="80" rx="42" ry="10" fill="rgba(0,0,0,0.20)"/>
        <path d="M25 70 h58 c5 0 9 4 9 9 v10 c0 10 -7 19 -16 22 l-4 17 h-26 l-4 -17 c-9 -3 -16 -12 -16 -22 V79 c0 -5 4 -9 9 -9 z" fill="#dfe6ef"/>
        <path d="M20 80 h72 c3 0 5 2 5 5 v4 c0 10 -7 19 -17 22 l-2 8 h-44 l-2 -8 c-10 -3 -17 -12 -17 -22 v-4 c0 -3 2 -5 5 -5 z" fill="#dfe6ef"/>
        <path d="M92 84 h16 c8 0 15 7 15 15 s-7 15 -15 15 h-16" fill="none" stroke="#dfe6ef" stroke-width="10" stroke-linecap="round"/>
        <path d="M36 42 c0 -9 7 -16 16 -16 c9 0 16 7 16 16" fill="none" stroke="#dfe6ef" stroke-width="8" stroke-linecap="round"/>
        <path d="M26 62 h62" stroke="#b7c3d3" stroke-width="6" stroke-linecap="round"/>
        <path d="M28 50 c6 -10 18 -16 30 -16 c11 0 22 5 29 16" fill="none" stroke="#b7c3d3" stroke-width="5" stroke-linecap="round"/>
      </g>

      <g transform="translate(32,0)">
        <text x="132" y="78" class="text" font-size="42" font-weight="500">Media Awake</text>
        <text x="136" y="120" class="muted" font-size="27" letter-spacing="2">READY</text>
      </g>
    </g>

    <rect x="780" y="46" width="132" height="90" rx="4" fill="#6e7d90" opacity="0.75"/>
    <rect x="782" y="48" width="128" height="86" rx="4" fill="#dfe3eb" opacity="0.18"/>
    <rect x="782" y="48" width="128" height="86" rx="4" fill="none" stroke="#a9b8c9" stroke-width="2" opacity="0.35"/>

    <line x1="30" y1="158" x2="960" y2="158" class="line"/>

    <g transform="translate(54,170)">
      <text x="0" y="52" class="text" font-size="32" font-weight="500">Sleep will work normally until media</text>
      <text x="0" y="96" class="text" font-size="32" font-weight="500">starts playing.</text>
    </g>
  </g>
</svg>





















































































































































































































































